services:
  web:
    build:
      context: .
      target: dev
    container_name: web-intercurso-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_API_URL: http://api:8000
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    networks:
      - intercurso

networks:
  intercurso:
    name: intercurso
    external: true
