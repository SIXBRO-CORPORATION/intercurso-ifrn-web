# Desenvolvimento com hot reload:  docker compose -f docker-compose.dev.yml watch
services:
  web:
    build:
      context: .
      target: dev
    container_name: web-intercurso-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_API_URL: http://api:8000
    networks:
      - intercurso
    develop:
      watch:
        - action: sync
          path: ./app/app
          target: /app/app
        - action: sync
          path: ./app/src
          target: /app/src
        - action: sync
          path: ./app/public
          target: /app/public
        - action: sync+restart
          path: ./app/next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./app/package.json
        - action: rebuild
          path: ./app/package-lock.json

networks:
  intercurso:
    name: intercurso
    external: true